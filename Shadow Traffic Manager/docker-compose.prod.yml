# =============================================================================
# Shadow Traffic — Hardened Production Docker Compose Specification
# =============================================================================
# Designed for single VPS or clustered deployment:
# - Multi-stage container builds with unprivileged users
# - Zero development bind-mounts (code immutable within images)
# - Explicit CPU & Memory constraints (limits & reservations)
# - Robust container restart policies & log rotation
# - Network isolation (database & internal microservices shielded from host)
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # TimescaleDB: Time-Series Storage Engine (Internal Only)
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: shadow-timescaledb-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-shadow_traffic}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Port 5432 intentionally NOT exposed to host in production for security
    volumes:
      - timescaledb_prod_data:/var/lib/postgresql/data
      - ./backend/src/storage/migrations/001_timescale_schema.sql:/docker-entrypoint-initdb.d/001_timescale_schema.sql:ro
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-shadow_traffic}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - shadow-net

  # ---------------------------------------------------------------------------
  # Prediction Engine: ML & Statistical Congestion Forecaster (Internal Only)
  # ---------------------------------------------------------------------------
  prediction-engine:
    build:
      context: .
      dockerfile: prediction-engine/Dockerfile
    container_name: shadow-prediction-engine-prod
    restart: unless-stopped
    environment:
      PORT: 8001
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FORECAST_HORIZON_MINUTES: ${FORECAST_HORIZON_MINUTES:-20}
      BASELINE_EWMA_ALPHA: ${BASELINE_EWMA_ALPHA:-0.25}
      LATENCY_CRITICAL_THRESHOLD_MS: ${LATENCY_CRITICAL_THRESHOLD_MS:-500.0}
      ERROR_RATE_CRITICAL_THRESHOLD_PERCENT: ${ERROR_RATE_CRITICAL_THRESHOLD_PERCENT:-5.0}
    # Port 8001 internal only — accessible via backend gateway on shadow-net
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - shadow-net

  # ---------------------------------------------------------------------------
  # Backend API Gateway: Telemetry Ingestion, Risk Assessment & Alerting
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: shadow-backend-prod
    restart: unless-stopped
    environment:
      PORT: 8000
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-shadow_traffic}
      PREDICTION_ENGINE_URL: http://prediction-engine:8001
      DEFAULT_API_KEY: ${DEFAULT_API_KEY}
      ALLOWED_API_KEYS: ${ALLOWED_API_KEYS}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
        reservations:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      timescaledb:
        condition: service_healthy
      prediction-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - shadow-net

  # ---------------------------------------------------------------------------
  # React Operations Dashboard: Static Nginx Host & WebSocket Proxy
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: shadow-dashboard-prod
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-80}:80"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - shadow-net

  # ---------------------------------------------------------------------------
  # Telemetry Collector Agent (Real Mode or Simulation Mode)
  # ---------------------------------------------------------------------------
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    container_name: shadow-collector-prod
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:8000
      API_KEY: ${DEFAULT_API_KEY}
      SITE_ID: ${SITE_ID:-prod-ecommerce-main}
      COLLECTOR_MODE: ${COLLECTOR_MODE:-simulate}
      REPORT_INTERVAL_SECONDS: ${REPORT_INTERVAL_SECONDS:-3.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-/var/log/nginx/access.log}
      PROMETHEUS_METRICS_URL: ${PROMETHEUS_METRICS_URL:-}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shadow-net

networks:
  shadow-net:
    driver: bridge
    name: shadow-net

volumes:
  timescaledb_prod_data:
    name: shadow-timescaledb-prod-data
    driver: local
