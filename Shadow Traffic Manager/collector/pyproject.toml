[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-collector"
version = "0.1.0"
description = "Metric collection and traffic simulation agent"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "../shared/python"]
