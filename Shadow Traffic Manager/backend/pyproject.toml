[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-backend"
version = "0.1.0"
description = "Core API Gateway, TimescaleDB persistence, and alerting engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.25",
    "httpx>=0.26.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "../shared/python"]
