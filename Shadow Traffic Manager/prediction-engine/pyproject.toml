[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-prediction-engine"
version = "0.1.0"
description = "Traffic congestion prediction service using statistical forecasting and heuristics"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "numpy>=1.26.0",
    "httpx>=0.26.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "../shared/python"]
