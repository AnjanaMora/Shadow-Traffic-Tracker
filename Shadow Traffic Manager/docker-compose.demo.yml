version: '3.8'

# =============================================================================
# Shadow Traffic — Live Demonstration & Benchmark Stack
#
# Usage:
#   docker-compose -f docker-compose.demo.yml up --build
#
# Scenario:
#   1. Runs 60s of normal diurnal traffic (baseline calibration, green gauges)
#   2. Injects staged congestion ramp: latency degrades first, triggering
#      proactive Warning with ETA ~14-18 min BEFORE error rate surges.
#   3. Error rate surges late (simulating severe queue saturation).
#   4. Recovers back to healthy seasonal equilibrium.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # TimescaleDB: Time-Series Hypertable Storage
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: shadow-demo-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shadow_traffic}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - demo_timescaledb_data:/var/lib/postgresql/data
      - ./backend/src/storage/migrations/001_timescale_schema.sql:/docker-entrypoint-initdb.d/001_timescale_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shadow_traffic}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - shadow-demo-net

  # ---------------------------------------------------------------------------
  # Prediction Engine: Forecasting & Explainable Risk Scorer
  # ---------------------------------------------------------------------------
  prediction-engine:
    build:
      context: .
      dockerfile: prediction-engine/Dockerfile
    container_name: shadow-demo-prediction-engine
    restart: unless-stopped
    environment:
      PORT: 8001
      LOG_LEVEL: info
      EWMA_ALPHA: 0.25
      FORECAST_HORIZON_MINUTES: 15
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - shadow-demo-net

  # ---------------------------------------------------------------------------
  # Backend API Gateway: Telemetry Ingestion & WebSocket Dispatch
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: shadow-demo-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      LOG_LEVEL: info
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@timescaledb:5432/${POSTGRES_DB:-shadow_traffic}
      PREDICTION_ENGINE_URL: http://prediction-engine:8001
      SHADOW_API_KEYS: shadow-dev-key-123,shadow-demo-key
      ALERT_COOLDOWN_SECONDS: 30
      ALERT_HYSTERESIS_COUNT: 2
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      prediction-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - shadow-demo-net

  # ---------------------------------------------------------------------------
  # React Operations Dashboard
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: shadow-demo-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shadow-demo-net

  # ---------------------------------------------------------------------------
  # Metric Collector Agent: Pre-Configured Demo Simulation
  # ---------------------------------------------------------------------------
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    container_name: shadow-demo-collector
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:8000
      SITE_ID: shadow-ecommerce-prod
      COLLECTOR_MODE: simulate
      REPORT_INTERVAL_SECONDS: 2.0
      SIM_SPEED_MULTIPLIER: 5.0
      SIM_BASE_USERS: 1400
      SIM_NOISE_PERCENT: 8.0
      SIM_CONGESTION_DELAY_SECONDS: 60.0
      SIM_CONGESTION_DURATION_SECONDS: 180.0
      SIM_CONGESTION_SEVERITY: 3.5
      API_KEY: shadow-dev-key-123
      LOG_LEVEL: info
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shadow-demo-net

networks:
  shadow-demo-net:
    driver: bridge

volumes:
  demo_timescaledb_data:
    driver: local
